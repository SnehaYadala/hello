<!DOCTYPE html>
<html>
<head>
    <title>Login and Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: white;
        }

        /* Main Page */
        .page {
            display: flex;
            height: 100vh;
        }

        /* LEFT SECTION */
        .welcome {
            width: 60%;
            background: #ef8cc8;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 48px;
            margin-bottom: 25px;
        }

        
        .welcome p {
            font-size: 18px;
        }

        /* RIGHT SECTION */
        .login-section {
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 82%;
            max-width: 440px;
            border: 1px solid #ccc;
            border-radius: 9px;
            padding: 50px 32px;
        }

        .login-box h2 {
            text-align: center;
            color: #da6ef8;
            font-size: 28px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #82b4ed;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            border: none;
            border-radius: 4px;
            background: #da6ef8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #da0fd3;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
        }

        .register-text a {
            color: #da6ef8;
            font-weight: bold;
            text-decoration: none;
        }

        /* REGISTRATION POPUP BACKGROUND */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        /* REGISTRATION BOX */
        .popup-box {
            width: 575px;
            background: white;
            border-radius: 10px;
            padding: 60px 37px 38px;
            position: relative;
        }

        .popup-box h2 {
            text-align: center;
            color: #da6ef8;
            font-size: 32px;
            margin-bottom: 25px;
        }

        .popup-box label {
            font-size: 20px;
            margin-top: 17px;
        }

        .popup-box input {
            height: 49px;
            font-size: 18px;
            padding: 12px;
        }

        .popup-box button {
            height: 50px;
            font-size: 20px;
            margin-top: 20px;
        }

        /* CLOSE BUTTON */
        .close {
            position: absolute;
            right: 35px;
            top: 38px;
            font-size: 30px;
            font-weight: bold;
            color: red;
            cursor: pointer;
        }

        .close:hover {
            color: darkred;
        }
    </style>
</head>

<body>

    <!-- MAIN PAGE -->
    <div class="page">

        <!-- LEFT SECTION -->
        <div class="welcome">

            <!-- Add your logo here -->
            <img src="logo.png" class="logo" alt="Logo">

            <h1>Welcome</h1>

            <div class="user-icon"></div>

            <p>Login to access your account</p>

        </div>


        <!-- RIGHT SECTION -->
        <div class="login-section">

            <div class="login-box">

                <h2>Login</h2>

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" placeholder="Enter your password">

                <button onclick="login()">Login</button>

                <p class="register-text">
                    Don't have an account?
                    <a href="#" onclick="openRegister()">Register Here</a>
                </p>

            </div>

        </div>

    </div>


    <!-- REGISTRATION POPUP -->
    <div id="registerPopup" class="popup">

        <div class="popup-box">

            <!-- Close -->
            <span class="close" onclick="closeRegister()">×</span>

            <h2>Create Account</h2>

            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Create password">

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password">

            <button onclick="register()">Register</button>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        function openRegister() {
            document.getElementById("registerPopup").style.display = "flex";
        }

        function closeRegister() {
            document.getElementById("registerPopup").style.display = "none";
        }

        function login() {
            alert("Login button clicked!");
        }

        function register() {
            alert("Registration successful!");
            closeRegister();
        }

        /* Close popup when clicking outside the box */
        window.onclick = function(event) {
            let popup = document.getElementById("registerPopup");

            if (event.target === popup) {
                closeRegister();
            }
        };

    </script>

</body>
</html>
