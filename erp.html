<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="erpstyle.css">
</head>
<body>
<div class="page"></div>

<div class="login-box">

    <h2>Login</h2>

    <form>

        <label>Enter Username <span>*</span></label>
        <input type="text" placeholder="Enter Username" required>

        <label>Enter Password <span>*</span></label>
        <input type="password" placeholder="Enter Password" required>

        <div class="captcha">teudfo</div>

        <input type="text" placeholder="Enter Verification Code" required>

        <div class="links">
            <a href="#">Forgot Password?</a>
            <span>|</span>
            <a href="#">Parent Registration?</a>
        </div>

        <div class="mfa">
            <a href="#">MFA Registration?</a>
        </div>

        <button type="submit">Login</button>

    </form>
</div>
</div>

</body>
</html>
